name: Kubernetes

# The whole system on a real (throwaway) Kubernetes cluster, on every change that could break it: kind inside
# the runner, the same k8s/local/up.sh used in Codespaces, then k8s/local/smoke.sh end to end through the
# Ingress (login, presigned upload, submit, KEDA scaling the worker from zero, AI opinion, audited download).
# The unit/integration workflows check each service alone; this one checks that they work together as deployed.

on:
  push:
    branches: [main]
    paths: ["k8s/**", "api/**", "ai-worker/**", "web/**", "infra/keycloak/**", "infra/aws/k3s/**", ".github/workflows/k8s.yml"]
  pull_request:
    paths: ["k8s/**", "api/**", "ai-worker/**", "web/**", "infra/keycloak/**", "infra/aws/k3s/**", ".github/workflows/k8s.yml"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: k8s-${{ github.ref }}
  cancel-in-progress: true

jobs:
  manifests:
    name: Manifests are valid
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Render the local overlay
        run: |
          # The two git-ignored inputs, with example values (up.sh writes the real ones)
          echo "PUBLIC_URL=http://localhost:8088" > k8s/overlays/local/local.env
          cp k8s/base/secrets.example.env k8s/overlays/local/secrets.env
          kubectl kustomize k8s/overlays/local > rendered.yaml
      - name: Render the aws overlay and the Argo CD apps
        run: |
          kubectl kustomize k8s/overlays/aws > rendered-aws.yaml
          for f in k8s/argocd/root.yaml k8s/argocd/apps/*.yaml k8s/platform/*.yaml infra/aws/k3s/*.yaml; do echo ---; cat "$f"; done > rendered-gitops.yaml
      - name: Validate against the Kubernetes and CRD schemas (KEDA, External Secrets, cert-manager, Traefik, Argo CD)
        run: |
          go install github.com/yannh/kubeconform/cmd/kubeconform@v0.7.0
          ~/go/bin/kubeconform -strict -summary -kubernetes-version 1.34.0 \
            -schema-location default \
            -schema-location 'https://raw.githubusercontent.com/datreeio/CRDs-catalog/main/{{.Group}}/{{.ResourceKind}}_{{.ResourceAPIVersion}}.json' \
            rendered.yaml rendered-aws.yaml rendered-gitops.yaml

  e2e:
    name: kind + smoke test
    needs: manifests
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - name: Install kind
        uses: helm/kind-action@v1
        with:
          install_only: true   # up.sh creates the cluster from k8s/local/kind-config.yaml

      - name: Cluster, add-ons, images, deploy
        run: k8s/local/up.sh

      - name: End-to-end smoke test
        run: k8s/local/smoke.sh

      - name: Diagnostics
        if: failure()
        run: |
          kubectl get pods -A -o wide || true
          kubectl -n creditdesk get all,ingress,hpa,scaledobject,pvc -o wide || true
          kubectl get events -A --sort-by=.lastTimestamp | tail -60 || true
          echo "::group::pods not ready"
          kubectl get pods -A --no-headers | awk '$3 !~ /^([0-9]+)\/\1$/ || $4 != "Running" {print $1, $2}' \
            | while read -r ns pod; do kubectl -n "$ns" describe pod "$pod" | tail -40; done || true
          echo "::endgroup::"
          for app in api keycloak ai-worker shell; do
            echo "::group::logs $app"; kubectl -n creditdesk logs "deploy/$app" --all-containers --tail 80 || true; echo "::endgroup::"
          done
          echo "::group::logs traefik"; kubectl -n traefik logs deploy/traefik --tail 60 || true; echo "::endgroup::"
          echo "::group::logs keda"; kubectl -n keda logs deploy/keda-operator --tail 60 || true; echo "::endgroup::"
