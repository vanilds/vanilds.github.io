name: AI worker

# Runs on every change to the worker: lint, unit tests, integration tests against a real RabbitMQ (Testcontainers)
# and a Docker build. Required to pass before merging to main.

on:
  push:
    branches: [main]
    paths: ["ai-worker/**", ".github/workflows/ai-worker.yml"]
  pull_request:
    paths: ["ai-worker/**", ".github/workflows/ai-worker.yml"]

permissions:
  contents: read

concurrency:
  group: ai-worker-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    working-directory: ai-worker

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: ai-worker/pyproject.toml

      - name: Install
        run: pip install -e ".[dev]"

      - name: Lint
        run: ruff check .

      - name: Unit and integration tests
        run: pytest -v

      - name: Docker image builds
        run: docker build -t creditdesk-ai-worker:ci .
