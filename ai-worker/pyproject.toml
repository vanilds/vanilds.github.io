[project]
name = "creditdesk-ai-worker"
version = "0.4.0"
description = "CreditDesk AI worker: drafts an advisory credit opinion for each submitted proposal (LangGraph)."
requires-python = ">=3.12,<3.13"
# Pinned: the image must be reproducible, and Dependabot (or a person) bumps them on purpose.
dependencies = [
    "langgraph==1.2.20",
    "aio-pika==10.2.2",
    "pydantic==2.14.3",
    "httpx==0.28.1",
    "aiohttp==3.14.5",
    "prometheus-client==0.26.0",
]

[project.optional-dependencies]
dev = [
    "pytest==9.2.0",
    "pytest-asyncio==1.4.1.post1",
    "testcontainers==4.15.0",
    "ruff==0.17.3",
]

[project.scripts]
creditdesk-worker = "creditdesk_worker.main:run"

[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "session"
asyncio_default_test_loop_scope = "session"
markers = ["integration: needs Docker (a real RabbitMQ through Testcontainers)"]

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "ASYNC", "S"]
ignore = ["S101"]  # assert is how pytest works
