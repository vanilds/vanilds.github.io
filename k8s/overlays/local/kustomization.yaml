apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - ../../base
  - minio.yaml   # S3-compatible stand-in; the aws overlay uses real Amazon S3
patches:
  # Keep the local cluster light: one replica each.
  - target: { kind: Deployment, name: "api|shell|mfe-customers|mfe-proposals" }
    patch: |-
      - op: replace
        path: /spec/replicas
        value: 1
  - target: { kind: HorizontalPodAutoscaler, name: api }
    patch: |-
      - op: replace
        path: /spec/minReplicas
        value: 1
