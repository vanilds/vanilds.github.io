# S3-compatible stand-in for Amazon S3 in the local cluster (the aws overlay uses real S3).
# Same image and command as compose.yaml; credentials from the Secret, so nothing is hard-coded here.
apiVersion: v1
kind: Service
metadata:
  name: seaweedfs
  labels: { app: seaweedfs }
spec:
  selector: { app: seaweedfs }
  ports:
    - { name: s3, port: 8333 }
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: seaweedfs
spec:
  serviceName: seaweedfs
  replicas: 1
  selector:
    matchLabels: { app: seaweedfs }
  template:
    metadata:
      labels: { app: seaweedfs }
    spec:
      enableServiceLinks: false      # no legacy <SERVICE>_PORT variables (see k8s/base/kustomization.yaml)
      initContainers:
        # SeaweedFS reads S3 identities from a JSON file: build it from the Secret
        - name: s3-config
          image: chrislusf/seaweedfs:4.50
          command: ["sh", "-c"]
          args:
            - >-
              printf '{"identities":[{"name":"creditdesk","credentials":[{"accessKey":"%s","secretKey":"%s"}],"actions":["Admin","Read","Write","List","Tagging"]}]}'
              "$S3_ACCESS_KEY" "$S3_SECRET_KEY" > /config/s3.json
          env:
            - name: S3_ACCESS_KEY
              valueFrom: { secretKeyRef: { name: creditdesk-secrets, key: S3_ACCESS_KEY } }
            - name: S3_SECRET_KEY
              valueFrom: { secretKeyRef: { name: creditdesk-secrets, key: S3_SECRET_KEY } }
          volumeMounts:
            - { name: config, mountPath: /config }
      containers:
        - name: seaweedfs
          image: chrislusf/seaweedfs:4.50
          args: ["server", "-dir=/data", "-s3", "-s3.port=8333", "-s3.config=/config/s3.json",
                 "-master.volumeSizeLimitMB=64", "-volume.max=10"]
          ports: [{ containerPort: 8333 }]
          readinessProbe:
            tcpSocket: { port: 8333 }
            initialDelaySeconds: 10
          resources:
            requests: { cpu: 50m, memory: 128Mi }
            limits: { memory: 384Mi }
          volumeMounts:
            - { name: data, mountPath: /data }
            - { name: config, mountPath: /config, readOnly: true }
      volumes:
        - name: config
          emptyDir: {}
  volumeClaimTemplates:
    - metadata: { name: data }
      spec:
        accessModes: ["ReadWriteOnce"]
        resources: { requests: { storage: 2Gi } }
