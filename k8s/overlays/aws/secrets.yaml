# Secrets on AWS: the values live only in SSM Parameter Store (SecureString, encrypted with KMS), created once
# by infra/aws/create-secrets.sh. External Secrets reads them and writes the Kubernetes Secret
# "creditdesk-secrets" that the pods already use (envFrom / secretKeyRef), so the base manifests do not change.
#
#   SSM /creditdesk/app/DB_PASSWORD  ──ESO (instance role)──▶  Secret creditdesk-secrets[DB_PASSWORD]  ──▶  pods
#
# Nothing secret is in git, in Argo CD or in the EC2 bootstrap. ESO authenticates with the EC2 instance role
# (default AWS credentials chain → metadata service): no AWS keys exist anywhere. The role may read only
# /creditdesk/* (infra/aws/iam/ec2-app-policy.json).
#
# SkipDryRunOnMissingResource: on a brand-new cluster Argo CD may sync this before the External Secrets CRDs
# exist; it creates what it can and retries these two until the operator (k8s/argocd/apps) has installed them.
apiVersion: external-secrets.io/v1
kind: SecretStore
metadata:
  name: aws-ssm
  annotations:
    argocd.argoproj.io/sync-options: SkipDryRunOnMissingResource=true
spec:
  provider:
    aws:
      service: ParameterStore
      region: us-east-1
      # No "auth": the controller uses the default credentials chain, i.e. the EC2 instance role
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: creditdesk-secrets
  annotations:
    argocd.argoproj.io/sync-options: SkipDryRunOnMissingResource=true
spec:
  refreshInterval: 1h          # a value changed in SSM reaches the Secret within an hour (or at once: annotate
                               # the ExternalSecret with force-sync=<timestamp>); pods read it at their next start
  secretStoreRef: { kind: SecretStore, name: aws-ssm }
  target:
    name: creditdesk-secrets
    creationPolicy: Owner      # ESO creates the Secret and owns it (Argo CD leaves it alone)
    deletionPolicy: Retain     # if SSM is unreachable or this object is removed, keep the last good values
  # Same keys as k8s/base/secrets.example.env. Not here on purpose:
  #   S3_ACCESS_KEY / S3_SECRET_KEY — on AWS the API uses the instance role
  #   LLM_API_KEY — optional; add the parameter and a line here to let a language model write the opinions
  data:
    - { secretKey: DB_USER, remoteRef: { key: /creditdesk/app/DB_USER } }
    - { secretKey: DB_PASSWORD, remoteRef: { key: /creditdesk/app/DB_PASSWORD } }
    - { secretKey: RABBITMQ_USER, remoteRef: { key: /creditdesk/app/RABBITMQ_USER } }
    - { secretKey: RABBITMQ_PASSWORD, remoteRef: { key: /creditdesk/app/RABBITMQ_PASSWORD } }
    - { secretKey: KEYCLOAK_ADMIN_PASSWORD, remoteRef: { key: /creditdesk/app/KEYCLOAK_ADMIN_PASSWORD } }
    - { secretKey: DOCUMENT_ENCRYPTION_KEY, remoteRef: { key: /creditdesk/app/DOCUMENT_ENCRYPTION_KEY } }
    - { secretKey: DOCUMENT_HASH_KEY, remoteRef: { key: /creditdesk/app/DOCUMENT_HASH_KEY } }
