# Grafana: read-only view over Prometheus, dashboards from git. No plugins, no sidecars.
# Opened through an SSM port forward (docs/operations.md); never exposed on the Internet.

replicas: 0                          # PAUSED — see k8s/monitoring/prometheus-values.yaml
priorityClassName: creditdesk-observability
deploymentStrategy: { type: Recreate }
testFramework: { enabled: false }

# A small disk for Grafana's SQLite file. Nothing in it needs a backup (dashboards, datasource and admin come from
# git and SSM), but without it Grafana re-runs its hundreds of schema migrations at EVERY start. Learned on the
# first deploy: under load that took longer than the liveness probe allowed, the probe killed it, the restart
# migrated again — a crash loop that kept the 2-vCPU node at load 6–7. With the file kept, a restart is seconds.
persistence:
  enabled: true
  size: 1Gi                        # k3s local-path; the file is a few MB
  accessModes: [ReadWriteOnce]

# Startup is slow only the first time (migrations), so it gets its own probe: up to 10 minutes to answer
# /api/health. Liveness starts only after that, and only asks "is the process stuck?" — the same split as the API
# (k8s/base/api.yaml). The chart's default liveness (60 s + 10 × 10 s) is what killed the first start.
startupProbe:
  httpGet: { path: /api/health, port: grafana }
  periodSeconds: 10
  failureThreshold: 60
livenessProbe:
  httpGet: { path: /api/health, port: grafana }
  periodSeconds: 30
  timeoutSeconds: 10
  failureThreshold: 3

admin:
  existingSecret: grafana-admin       # k8s/monitoring/grafana-secret.yaml (External Secrets ← SSM)
  userKey: admin-user
  passwordKey: admin-password

# Measured on the node: ~250 Mi while starting (Grafana 13), so 256 Mi was too tight.
resources:
  requests: { cpu: 25m, memory: 160Mi }
  limits: { memory: 384Mi }

grafana.ini:
  analytics: { reporting_enabled: false, check_for_updates: false, check_for_plugin_updates: false }
  news: { news_feed_enabled: false }
  users: { allow_sign_up: false }
  auth.anonymous: { enabled: false }
  server: { root_url: http://localhost:3000 }   # the port forward's address
  unified_alerting: { enabled: true }           # shows the Prometheus alert rules (Alerting → Alert rules)

datasources:
  datasources.yaml:
    apiVersion: 1
    datasources:
      - name: Prometheus
        uid: prometheus                  # fixed uid: the dashboard JSON refers to it
        type: prometheus
        url: http://prometheus-server.monitoring.svc
        access: proxy
        isDefault: true
        editable: false
        jsonData:
          timeInterval: 30s              # = scrape interval: $__rate_interval is never shorter than 4 scrapes

dashboardProviders:
  dashboardproviders.yaml:
    apiVersion: 1
    providers:
      - name: creditdesk
        folder: CreditDesk
        type: file
        disableDeletion: true
        allowUiUpdates: false            # git is the source; a UI edit would be lost at the next restart anyway
        options: { path: /var/lib/grafana/dashboards/creditdesk }

dashboardsConfigMaps:
  creditdesk: grafana-dashboards-creditdesk   # built by k8s/monitoring/dashboards/build.py
