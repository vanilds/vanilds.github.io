# Grafana's admin password, from SSM like every other secret (infra/aws/create-secrets.sh creates it).
# Why not the chart's own random password: the chart generates a new one at every render, and Argo CD renders
# on every sync — the Secret would change every 3 minutes. Read it in CloudShell with:
#   aws ssm get-parameter --name /creditdesk/app/GRAFANA_ADMIN_PASSWORD --with-decryption --query Parameter.Value --output text
apiVersion: external-secrets.io/v1
kind: SecretStore
metadata:
  name: aws-ssm
  annotations:
    argocd.argoproj.io/sync-options: SkipDryRunOnMissingResource=true
spec:
  provider:
    aws:
      service: ParameterStore
      region: us-east-1          # no "auth": the EC2 instance role, allowed to read /creditdesk/* only
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: grafana-admin
  annotations:
    argocd.argoproj.io/sync-options: SkipDryRunOnMissingResource=true
spec:
  refreshInterval: 1h
  secretStoreRef: { kind: SecretStore, name: aws-ssm }
  target:
    name: grafana-admin
    creationPolicy: Owner
    deletionPolicy: Retain
    template:
      data:
        admin-user: admin
        admin-password: "{{ .password }}"
  data:
    - { secretKey: password, remoteRef: { key: /creditdesk/app/GRAFANA_ADMIN_PASSWORD } }
