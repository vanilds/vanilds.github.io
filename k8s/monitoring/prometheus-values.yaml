# Prometheus for one 4 GB node that already runs the whole application (~590 MB free before Phase 7).
# Every choice below trades history or detail for memory; the budget for all monitoring pods is ~400 MB.
#
#   what                  why
#   ────────────────────  ───────────────────────────────────────────────────────────────────────────────────
#   scrape every 30 s     half the samples of the default 15 s, still fine for 5-minute alert windows
#   3 days of history     the EC2 is off at night and on weekends: 3 days covers "what happened on Friday?"
#   no Alertmanager       alerts are evaluated and shown in Grafana (Alerting → Alert rules); a notifier is
#                         one more pod for a demo nobody is on call for (see docs/operations.md, "Next steps")
#   no API-server/kubelet the heaviest default jobs, thousands of series nobody here would look at
#   cAdvisor allowlist    only the container metrics the dashboards use (memory, CPU, OOMs, throttling)
#   priority -100         under memory pressure monitoring is evicted first (k8s/monitoring/priority-class.yaml)

alertmanager: { enabled: false }
prometheus-pushgateway: { enabled: false }

# ── PAUSED (2026-11-05) ─────────────────────────────────────────────────────────────────────────────────────────
# The first deploy took the node down: memory ran out, the kubelet stopped answering (NodeNotReady), API and
# Keycloak went 503. Monitoring is switched off until it is re-sized and re-enabled on purpose
# (docs/incidents/README.md, drill log). To turn it back on: remove every line marked PAUSED (here and in
# grafana-values.yaml).

server:
  replicaCount: 0                # PAUSED, see above
  priorityClassName: creditdesk-observability
  global:
    scrape_interval: 30s
    scrape_timeout: 10s
    evaluation_interval: 30s
  retention: 3d
  retentionSize: 1500MB          # whichever comes first; the volume has 2 GiB
  persistentVolume:
    enabled: true
    size: 2Gi                    # k3s local-path: a folder on the EC2 disk
  strategy: { type: Recreate }   # two Prometheus processes cannot share one data folder (TSDB lock)
  resources:
    requests: { cpu: 100m, memory: 192Mi }
    limits: { memory: 448Mi }
  # Prometheus 3 sizes GOGC itself; GOMEMLIMIT makes the Go runtime collect harder before reaching the limit
  # instead of being OOM-killed at it.
  env:
    - name: GOMEMLIMIT
      value: "400MiB"
  securityContext:
    runAsNonRoot: true
    runAsUser: 65534
    runAsGroup: 65534
    fsGroup: 65534

configmapReload:
  prometheus:
    resources:
      requests: { cpu: 5m, memory: 8Mi }
      limits: { memory: 32Mi }

kube-state-metrics:
  enabled: false                 # PAUSED
  priorityClassName: creditdesk-observability
  # Only the objects the dashboards and alerts read: restarts, OOM kills, readiness, HPAs, backup jobs, disks
  collectors: [cronjobs, deployments, horizontalpodautoscalers, jobs, nodes, persistentvolumeclaims, pods, statefulsets]
  resources:
    requests: { cpu: 10m, memory: 32Mi }
    limits: { memory: 96Mi }

prometheus-node-exporter:
  enabled: false                 # PAUSED
  priorityClassName: creditdesk-observability
  resources:
    requests: { cpu: 10m, memory: 24Mi }
    limits: { memory: 64Mi }

scrapeConfigs:
  # Off: heavy and not used by any panel or alert
  kubernetes-api-servers: { enabled: false }
  kubernetes-nodes: { enabled: false }
  kubernetes-service-endpoints-slow: { enabled: false }
  kubernetes-services: { enabled: false }            # needs a blackbox exporter
  kubernetes-pods-slow: { enabled: false }
  prometheus-pushgateway: { enabled: false }
  # Kept as the chart defines them:
  #   prometheus                    — Prometheus itself
  #   kubernetes-service-endpoints  — kube-state-metrics and node-exporter (prometheus.io/scrape on their Services)
  #   kubernetes-pods               — every pod annotated prometheus.io/scrape: the API (/actuator/prometheus),
  #                                   the AI worker (/metrics), Traefik; the pod's labels become series labels
  #                                   (app="api", ...), which is what the dashboards filter on
  kubernetes-nodes-cadvisor:
    metric_relabel_configs:
      - source_labels: [__name__]
        action: keep
        regex: container_(memory_working_set_bytes|memory_swap|cpu_usage_seconds_total|cpu_cfs_throttled_periods_total|cpu_cfs_periods_total|oom_events_total)
      - source_labels: [container]       # the pod-level aggregate and the pause container: noise
        action: drop
        regex: (|POD)

# RabbitMQ: queue depths. /metrics/detailed with these two families gives one series per queue (messages,
# ready, unacked, consumers) without the whole per-object dump. Scraped through the Service's "metrics" port.
extraScrapeConfigs: |
  - job_name: rabbitmq
    metrics_path: /metrics/detailed
    params:
      family: [queue_coarse_metrics, queue_consumer_count]
    kubernetes_sd_configs:
      - role: endpoints
        namespaces: { names: [creditdesk] }
    relabel_configs:
      - source_labels: [__meta_kubernetes_service_name, __meta_kubernetes_endpoint_port_name]
        action: keep
        regex: rabbitmq;metrics
      - source_labels: [__meta_kubernetes_pod_name]
        target_label: pod
  - job_name: rabbitmq-node
    kubernetes_sd_configs:
      - role: endpoints
        namespaces: { names: [creditdesk] }
    relabel_configs:
      - source_labels: [__meta_kubernetes_service_name, __meta_kubernetes_endpoint_port_name]
        action: keep
        regex: rabbitmq;metrics
      - source_labels: [__meta_kubernetes_pod_name]
        target_label: pod
    metric_relabel_configs:                 # node health only: memory alarm, connections, disk
      - source_labels: [__name__]
        action: keep
        regex: rabbitmq_(alarms_.*|connections|process_resident_memory_bytes|resident_memory_limit_bytes|disk_space_available_bytes|queue_messages)

serverFiles:
  recording_rules.yml:
    groups:
      - name: creditdesk-api.recording
        rules:
          # Requests per second and 5xx share per route, computed once here instead of in every panel/alert.
          # "uri" is the route template (/api/proposals/{id}), never the raw path, so series stay few.
          - record: creditdesk:http_requests:rate5m
            expr: sum by (uri, method, status) (rate(http_server_requests_seconds_count{app="api", uri!~"/actuator.*"}[5m]))
          - record: creditdesk:http_errors:ratio_rate5m
            expr: |
              sum(rate(http_server_requests_seconds_count{app="api", uri!~"/actuator.*", status=~"5.."}[5m]))
              / clamp_min(sum(rate(http_server_requests_seconds_count{app="api", uri!~"/actuator.*"}[5m])), 0.001)
          - record: creditdesk:http_latency:p95_5m
            expr: histogram_quantile(0.95, sum by (le) (rate(http_server_requests_seconds_bucket{app="api", uri!~"/actuator.*"}[5m])))

  alerting_rules.yml:
    groups:
      # ── The user's point of view: is the demo working? ────────────────────────────────────────────────────
      - name: creditdesk-app
        rules:
          - alert: ApiDown
            expr: absent(up{app="api"} == 1)
            for: 3m
            labels: { severity: critical }
            annotations:
              summary: No API pod is answering /actuator/prometheus
              runbook: docs/incidents/README.md#api-down
          - alert: ApiErrorRateHigh
            expr: creditdesk:http_errors:ratio_rate5m > 0.05 and sum(rate(http_server_requests_seconds_count{app="api"}[5m])) > 0.05
            for: 5m
            labels: { severity: warning }
            annotations:
              summary: "More than 5% of API requests fail with 5xx ({{ $value | humanizePercentage }})"
              runbook: docs/incidents/README.md#api-errors
          - alert: ApiSlow
            expr: creditdesk:http_latency:p95_5m > 1
            for: 10m
            labels: { severity: warning }
            annotations:
              summary: "API p95 latency above 1 s ({{ $value | humanizeDuration }})"
          # The outbox fills when RabbitMQ is unreachable: proposals are still accepted, events wait in Postgres
          - alert: OutboxBacklog
            expr: max(creditdesk_outbox_pending) > 20
            for: 5m
            labels: { severity: warning }
            annotations:
              summary: "{{ $value }} events waiting in the outbox (RabbitMQ unreachable?)"
              runbook: docs/incidents/README.md#rabbitmq-down
          - alert: OpinionQueueBacklog
            expr: rabbitmq_detailed_queue_messages{queue="ai-worker.proposal-submitted"} > 25
            for: 10m
            labels: { severity: warning }
            annotations:
              summary: "{{ $value }} proposals waiting for an AI opinion (worker not scaling?)"
              runbook: docs/incidents/README.md#worker-stuck
          - alert: DeadLetters
            expr: rabbitmq_detailed_queue_messages{queue=~".*\\.dlq"} > 0
            for: 1m
            labels: { severity: warning }
            annotations:
              summary: "{{ $value }} message(s) in {{ $labels.queue }} — they will not be retried by themselves"
              runbook: docs/incidents/README.md#dead-letters
          - alert: RabbitMqMemoryAlarm
            expr: max(rabbitmq_alarms_memory_used_watermark) > 0 or max(rabbitmq_alarms_free_disk_space_watermark) > 0
            for: 1m
            labels: { severity: critical }
            annotations:
              summary: RabbitMQ raised a resource alarm and is blocking publishers

      # ── The platform: pods, node, backups ────────────────────────────────────────────────────────────────
      - name: creditdesk-platform
        rules:
          - alert: PodCrashLooping
            expr: increase(kube_pod_container_status_restarts_total{namespace=~"creditdesk|monitoring"}[15m]) >= 3
            labels: { severity: warning }
            annotations:
              summary: "{{ $labels.namespace }}/{{ $labels.pod }} restarted {{ $value | humanize }} times in 15 min"
          - alert: ContainerOomKilled
            expr: |
              increase(kube_pod_container_status_restarts_total[10m]) > 0
              and on (namespace, pod, container) kube_pod_container_status_last_terminated_reason{reason="OOMKilled"} == 1
            labels: { severity: warning }
            annotations:
              summary: "{{ $labels.namespace }}/{{ $labels.pod }} ({{ $labels.container }}) was OOM-killed: its memory limit is too low"
              runbook: docs/incidents/README.md#oom
          - alert: DeploymentNotReady
            expr: kube_deployment_status_replicas_available{namespace="creditdesk"} < kube_deployment_spec_replicas{namespace="creditdesk"} and kube_deployment_spec_replicas{namespace="creditdesk"} > 0
            for: 10m
            labels: { severity: warning }
            annotations:
              summary: "{{ $labels.deployment }} has fewer ready pods than it wants"
          - alert: NodeMemoryLow
            expr: node_memory_MemAvailable_bytes / node_memory_MemTotal_bytes < 0.10
            for: 10m
            labels: { severity: warning }
            annotations:
              summary: "Only {{ $value | humanizePercentage }} of the node's memory is available"
              runbook: docs/incidents/README.md#oom
          - alert: NodeSwapHeavy
            expr: (node_memory_SwapTotal_bytes - node_memory_SwapFree_bytes) / clamp_min(node_memory_SwapTotal_bytes, 1) > 0.6
            for: 15m
            labels: { severity: warning }
            annotations:
              summary: "{{ $value | humanizePercentage }} of swap in use: the node is short of memory and getting slow"
          - alert: NodeDiskFilling
            expr: node_filesystem_avail_bytes{mountpoint="/", fstype!="tmpfs"} / node_filesystem_size_bytes{mountpoint="/", fstype!="tmpfs"} < 0.15
            for: 15m
            labels: { severity: warning }
            annotations:
              summary: "Root disk has {{ $value | humanizePercentage }} free"
          # The EC2 is off from Friday 20:00 to Monday 08:00, so the last backup can be ~60 h old on a Monday
          # morning. 72 h means "a weekday backup was missed", not "it is Monday".
          - alert: BackupMissing
            expr: time() - max(kube_cronjob_status_last_successful_time{namespace="creditdesk", cronjob="postgres-backup"}) > 72 * 3600
            for: 30m
            labels: { severity: critical }
            annotations:
              summary: No successful database backup in the last 72 hours
              runbook: docs/incidents/README.md#backup-failed
          - alert: BackupJobFailed
            expr: kube_job_status_failed{namespace="creditdesk", job_name=~"postgres-(backup|restore-test).*"} > 0
            labels: { severity: critical }
            annotations:
              summary: "Job {{ $labels.job_name }} failed"
              runbook: docs/incidents/README.md#backup-failed
          - alert: CertificateExpiringSoon
            expr: certmanager_certificate_expiration_timestamp_seconds - time() < 14 * 86400
            for: 1h
            labels: { severity: warning }
            annotations:
              summary: "TLS certificate {{ $labels.name }} expires in {{ $value | humanizeDuration }} (renewal stuck?)"
