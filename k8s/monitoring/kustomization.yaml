# Objects that go with the Prometheus and Grafana charts (k8s/argocd/apps/monitoring.yaml). The *-values.yaml
# files in this folder are read by the charts, not by kustomize.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: monitoring

resources:
  - priority-class.yaml
  - grafana-secret.yaml

# Dashboards as code: the JSON files are built by dashboards/build.py and mounted into Grafana as files
# (dashboardsConfigMaps in grafana-values.yaml). Editing a panel in the UI is lost at the next restart — change
# build.py, run it, commit. Fixed name: the Grafana chart refers to it by name.
configMapGenerator:
  - name: grafana-dashboards-creditdesk
    files:
      - dashboards/creditdesk-application.json
      - dashboards/creditdesk-platform.json
    options:
      disableNameSuffixHash: true
