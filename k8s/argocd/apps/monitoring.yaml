# Monitoring (Phase 7, after the 2026-11-05 incident): the node only collects, Grafana Cloud does the rest.
#   1. Grafana Alloy        — scrapes and ships samples to Grafana Cloud (k8s/monitoring/alloy/config.alloy)
#   2. kube-state-metrics   — Kubernetes objects as metrics
#   3. k8s/monitoring       — PriorityClass, the Alloy config, the Grafana Cloud endpoint (ConfigMap) and token
#                             (External Secrets ← SSM). Also the "$values" source the two charts read from.
# Dashboards and alert rules live in git too, but are uploaded to Grafana Cloud, not applied here
# (k8s/monitoring/dashboards, k8s/monitoring/rules, infra/grafana-cloud).
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: monitoring
  namespace: argocd
spec:
  project: default
  sources:
    - repoURL: https://grafana.github.io/helm-charts
      chart: alloy
      targetRevision: 1.15.0             # Alloy v1.21.3
      helm:
        releaseName: alloy
        valueFiles: [$values/k8s/monitoring/alloy-values.yaml]
    - repoURL: https://prometheus-community.github.io/helm-charts
      chart: kube-state-metrics
      targetRevision: 8.8.0              # kube-state-metrics v2.20
      helm:
        releaseName: kube-state-metrics
        valueFiles: [$values/k8s/monitoring/kube-state-metrics-values.yaml]
    - repoURL: https://github.com/vanilds/vanilds.github.io.git
      targetRevision: main
      path: k8s/monitoring
      ref: values
  destination:
    server: https://kubernetes.default.svc
    namespace: monitoring
  syncPolicy:
    automated: { prune: true, selfHeal: true }
    syncOptions: [CreateNamespace=true, ServerSideApply=true]
    retry: { limit: -1, backoff: { duration: 30s, factor: 2, maxDuration: 5m } }
