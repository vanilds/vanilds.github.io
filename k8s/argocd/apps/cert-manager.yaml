# TLS certificates from Let's Encrypt for creditdesk.duckdns.org (issuers in k8s/platform). Renews them by itself
# 30 days before they expire.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: cert-manager
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://charts.jetstack.io
    chart: cert-manager
    targetRevision: v1.21.3
    helm:
      valuesObject:
        crds: { enabled: true }
        resources: { requests: { cpu: 10m, memory: 48Mi }, limits: { memory: 128Mi } }
        webhook:
          resources: { requests: { cpu: 10m, memory: 24Mi }, limits: { memory: 64Mi } }
        cainjector:
          resources: { requests: { cpu: 10m, memory: 48Mi }, limits: { memory: 128Mi } }
  destination:
    server: https://kubernetes.default.svc
    namespace: cert-manager
  syncPolicy:
    automated: { prune: true, selfHeal: true }
    syncOptions: [CreateNamespace=true, ServerSideApply=true]   # server-side: the CRDs are too big for the
                                                                # last-applied annotation of a client-side apply
    retry: { limit: -1, backoff: { duration: 30s, factor: 2, maxDuration: 5m } }
