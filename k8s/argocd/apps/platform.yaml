# Cluster-wide objects that belong to no app: the Let's Encrypt issuers (k8s/platform).
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: platform
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/vanilds/vanilds.github.io.git
    targetRevision: main
    path: k8s/platform
  destination:
    server: https://kubernetes.default.svc
  syncPolicy:
    automated: { prune: true, selfHeal: true }
    retry: { limit: -1, backoff: { duration: 30s, factor: 2, maxDuration: 5m } }
