# External Secrets Operator: copies the CreditDesk secrets from SSM Parameter Store into a Kubernetes Secret
# (k8s/overlays/aws/secrets.yaml). Authenticates with the EC2 instance role — no AWS keys.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: external-secrets
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://charts.external-secrets.io
    chart: external-secrets
    targetRevision: 2.14.0
    helm:
      valuesObject:
        installCRDs: true
        resources: { requests: { cpu: 10m, memory: 48Mi }, limits: { memory: 160Mi } }
        # The admission webhook (and the controller that rotates its certificate) only validates objects as
        # they are written; the controller does the real work without it. Two fewer pods on a 4 GB node — and
        # every ExternalSecret here comes from git, already checked by kubeconform in CI.
        webhook: { create: false }
        certController: { create: false }
  destination:
    server: https://kubernetes.default.svc
    namespace: external-secrets
  syncPolicy:
    automated: { prune: true, selfHeal: true }
    syncOptions: [CreateNamespace=true, ServerSideApply=true]
    retry: { limit: -1, backoff: { duration: 30s, factor: 2, maxDuration: 5m } }
