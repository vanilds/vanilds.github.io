# KEDA: scales the AI worker from zero on the RabbitMQ queue length (k8s/base/ai-worker.yaml). Same chart and
# version as the kind cluster (k8s/local/up.sh).
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: keda
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://kedacore.github.io/charts
    chart: keda
    targetRevision: 2.21.0
    helm:
      valuesObject:
        webhooks: { enabled: false }   # validation only, like External Secrets' (see that file)
        resources:
          operator: { requests: { cpu: 25m, memory: 64Mi }, limits: { memory: 256Mi } }
          metricServer: { requests: { cpu: 25m, memory: 64Mi }, limits: { memory: 256Mi } }
  destination:
    server: https://kubernetes.default.svc
    namespace: keda
  syncPolicy:
    automated: { prune: true, selfHeal: true }
    syncOptions: [CreateNamespace=true, ServerSideApply=true]
    retry: { limit: -1, backoff: { duration: 30s, factor: 2, maxDuration: 5m } }
