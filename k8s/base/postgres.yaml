# PostgreSQL 16, one replica with its own disk. A StatefulSet (not a Deployment) because the pod keeps a stable
# name (postgres-0) and its PersistentVolumeClaim follows it: a restart reattaches the same data.
# Backups (daily pg_dump to S3 + restore test) come in Phase 7.
apiVersion: v1
kind: Service
metadata:
  name: postgres
  labels: { app: postgres }
spec:
  clusterIP: None            # headless: "postgres" resolves straight to the pod, no load balancing to do
  selector: { app: postgres }
  ports: [{ name: postgres, port: 5432 }]
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: postgres
  labels: { app: postgres }
spec:
  serviceName: postgres
  replicas: 1
  selector:
    matchLabels: { app: postgres }
  template:
    metadata:
      labels: { app: postgres }
    spec:
      # Postgres needs time to write a clean checkpoint on shutdown; a hard kill means crash recovery at start
      terminationGracePeriodSeconds: 60
      securityContext:
        seccompProfile: { type: RuntimeDefault }
      containers:
        - name: postgres
          image: public.ecr.aws/docker/library/postgres:16-alpine
          ports: [{ name: postgres, containerPort: 5432 }]
          env:
            - name: POSTGRES_DB
              valueFrom: { configMapKeyRef: { name: creditdesk-config, key: DB_NAME } }
            - name: POSTGRES_USER
              valueFrom: { secretKeyRef: { name: creditdesk-secrets, key: DB_USER } }
            - name: POSTGRES_PASSWORD
              valueFrom: { secretKeyRef: { name: creditdesk-secrets, key: DB_PASSWORD } }
            - name: PGDATA                       # a subfolder: the volume root may hold lost+found
              value: /var/lib/postgresql/data/pgdata
          # Ready = accepting connections. Liveness uses the same cheap check, less often and more patiently:
          # restarting a database that is only slow would make things worse.
          readinessProbe:
            exec: { command: ["sh", "-c", "pg_isready -U \"$POSTGRES_USER\" -d \"$POSTGRES_DB\""] }
            periodSeconds: 10
          livenessProbe:
            exec: { command: ["sh", "-c", "pg_isready -U \"$POSTGRES_USER\" -d \"$POSTGRES_DB\""] }
            initialDelaySeconds: 30
            periodSeconds: 30
            failureThreshold: 5
          resources:
            requests: { cpu: 100m, memory: 256Mi }
            limits: { memory: 512Mi }
          securityContext:
            allowPrivilegeEscalation: false
          volumeMounts:
            - { name: data, mountPath: /var/lib/postgresql/data }
  volumeClaimTemplates:
    - metadata: { name: data }
      spec:
        accessModes: ["ReadWriteOnce"]
        resources: { requests: { storage: 1Gi } }
