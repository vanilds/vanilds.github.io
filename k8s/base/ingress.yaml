apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: creditdesk
  annotations:
    nginx.ingress.kubernetes.io/proxy-body-size: "10m"   # document uploads
spec:
  ingressClassName: nginx
  rules:
    - host: creditdesk.local
      http:
        paths:
          - path: /api
            pathType: Prefix
            backend: { service: { name: api, port: { number: 8080 } } }
          - path: /auth
            pathType: Prefix
            backend: { service: { name: keycloak, port: { number: 8080 } } }
          - path: /mfe/customers
            pathType: Prefix
            backend: { service: { name: mfe-customers, port: { number: 80 } } }
          - path: /mfe/proposals
            pathType: Prefix
            backend: { service: { name: mfe-proposals, port: { number: 80 } } }
          - path: /
            pathType: Prefix
            backend: { service: { name: shell, port: { number: 80 } } }
