apiVersion: v1
kind: ConfigMap
metadata:
  name: creditdesk-config
data:
  SPRING_PROFILES_ACTIVE: "k8s"
  DB_HOST: "postgres"
  DB_NAME: "creditdesk"
  RABBITMQ_HOST: "rabbitmq"
  REDIS_HOST: "redis"
  S3_ENDPOINT: "http://minio:9000"
  S3_BUCKET: "documents"
  PROPOSAL_EXCHANGE: "proposals"
  PROPOSAL_SUBMITTED_QUEUE: "proposal.submitted"
  AUDIT_QUEUE: "audit.events"
  OIDC_ISSUER_URI: "http://creditdesk.local/auth/realms/creditdesk"
---
# Dev-only placeholders. In real environments use Sealed Secrets / External Secrets.
apiVersion: v1
kind: Secret
metadata:
  name: creditdesk-secrets
type: Opaque
stringData:
  DB_USER: "creditdesk"
  DB_PASSWORD: "change-me"
  RABBITMQ_USER: "creditdesk"
  RABBITMQ_PASSWORD: "change-me"
  S3_ACCESS_KEY: "minioadmin"
  S3_SECRET_KEY: "change-me-minio"
  LLM_API_KEY: "set-me-locally"
  KEYCLOAK_ADMIN_PASSWORD: "change-me-keycloak"
