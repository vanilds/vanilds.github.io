apiVersion: v1
kind: ConfigMap
metadata:
  name: creditdesk-config
data:
  SPRING_PROFILES_ACTIVE: "k8s"
  DB_HOST: "postgres"
  DB_NAME: "creditdesk"
  RABBITMQ_HOST: "rabbitmq"
  REDIS_HOST: "redis"
  # Local overlay: SeaweedFS. The aws overlay removes S3_ENDPOINT (real S3) and sets the real bucket.
  # S3_PUBLIC_ENDPOINT (the address browsers use in presigned URLs) is set with the Ingress in Phase 5.
  S3_ENDPOINT: "http://seaweedfs:8333"
  S3_BUCKET: "documents"
  # Exchanges and queue names are code (api messaging/Topology.java, ai-worker topology.py), not config:
  # both sides must agree on them exactly.
  OIDC_ISSUER_URI: "http://creditdesk.local/auth/realms/creditdesk"          # public URL inside the tokens
  OIDC_JWK_SET_URI: "http://keycloak:8080/auth/realms/creditdesk/protocol/openid-connect/certs"  # in-cluster
---
# Dev-only placeholders. In real environments use Sealed Secrets / External Secrets.
apiVersion: v1
kind: Secret
metadata:
  name: creditdesk-secrets
type: Opaque
stringData:
  DB_USER: "creditdesk"
  DB_PASSWORD: "change-me"
  RABBITMQ_USER: "creditdesk"
  RABBITMQ_PASSWORD: "change-me"
  S3_ACCESS_KEY: "creditdesk"
  S3_SECRET_KEY: "change-me-s3"
  LLM_API_KEY: "set-me-locally"     # placeholder = no model: the worker uses its rules template
  KEYCLOAK_ADMIN_PASSWORD: "change-me-keycloak"
  # 32 random bytes each, base64 (openssl rand -base64 32). From SSM Parameter Store in Phase 6.
  DOCUMENT_ENCRYPTION_KEY: "set-me"
  DOCUMENT_HASH_KEY: "set-me"
