apiVersion: v1
kind: Service
metadata:
  name: ai-worker
  labels: { app: ai-worker }
spec:
  selector: { app: ai-worker }
  ports: [{ name: http, port: 8000 }]  # health + /metrics only
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: ai-worker
spec:
  replicas: 1
  selector:
    matchLabels: { app: ai-worker }
  template:
    metadata:
      labels: { app: ai-worker }
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/path: /metrics
        prometheus.io/port: "8000"
    spec:
      containers:
        - name: ai-worker
          image: creditdesk-ai-worker:dev
          imagePullPolicy: IfNotPresent
          ports: [{ containerPort: 8000 }]
          envFrom:
            - configMapRef: { name: creditdesk-config }
            - secretRef: { name: creditdesk-secrets }
          readinessProbe:
            httpGet: { path: /health, port: 8000 }
          resources:
            requests: { cpu: 100m, memory: 256Mi }
            limits: { memory: 512Mi }
# Phase 5: scale on RabbitMQ queue length with KEDA instead of a fixed replica count.
