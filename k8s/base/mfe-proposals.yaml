apiVersion: v1
kind: Service
metadata:
  name: mfe-proposals
spec:
  selector: { app: mfe-proposals }
  ports: [{ port: 80 }]
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: mfe-proposals
spec:
  replicas: 2
  selector:
    matchLabels: { app: mfe-proposals }
  template:
    metadata:
      labels: { app: mfe-proposals }
    spec:
      containers:
        - name: mfe-proposals
          image: creditdesk-mfe-proposals:dev
          imagePullPolicy: IfNotPresent
          ports: [{ containerPort: 80 }]
          readinessProbe:
            httpGet: { path: /, port: 80 }
          resources:
            requests: { cpu: 25m, memory: 32Mi }
            limits: { memory: 64Mi }
