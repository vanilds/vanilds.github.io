# Micro frontend: static files loaded by the shell under MFE_PATH (/mfe/customers/ or /mfe/proposals/).
# The Ingress forwards the path unchanged, so the files live under that path here too (no rewrite rules).
server {
    listen 8080;
    root /usr/share/nginx/html;
    server_tokens off;

    include /etc/nginx/snippets/common.conf;

    # The shell on GitHub Pages (another origin) imports these ES modules, which needs CORS. They are public,
    # static and fetched without cookies, so "*" exposes nothing.
    location ^~ MFE_PATH {
        add_header Access-Control-Allow-Origin "*" always;
        add_header Cache-Control "no-cache" always;
        include /etc/nginx/snippets/headers.conf;

        location ~* "[.-][A-Za-z0-9_-]{8,12}\.(?:js|css)$" {
            add_header Access-Control-Allow-Origin "*" always;
            add_header Cache-Control "public, max-age=31536000, immutable";  # no "always": a 404 is never cached
            include /etc/nginx/snippets/headers.conf;
            try_files $uri =404;
        }
        try_files $uri =404;
    }
}
