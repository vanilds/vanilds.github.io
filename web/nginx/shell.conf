# Shell: the portfolio + the demo host. A single-page app: any unknown path is a route of the Angular router.
server {
    listen 8080;
    root /usr/share/nginx/html;
    server_tokens off;

    include /etc/nginx/snippets/common.conf;

    # Hashed file names (main-MNBCA432.js, rxjs.joDRaYzmH-.js) never change content: cache them for a year.
    # Everything else (index.html, remoteEntry.json, importmap.json, photos) falls to "/" below.
    location ~* "[.-][A-Za-z0-9_-]{8,12}\.(?:js|css)$" {
        add_header Cache-Control "public, max-age=31536000, immutable";  # no "always": a 404 is never cached
        include /etc/nginx/snippets/headers.conf;
        try_files $uri =404;
    }

    # index.html and remoteEntry.json name the hashed files of the current release: always revalidate them,
    # so a new deploy is picked up on the next page load instead of whenever the browser's cache expires.
    location / {
        add_header Cache-Control "no-cache" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        include /etc/nginx/snippets/headers.conf;
        try_files $uri $uri/ /index.html;
    }
}
