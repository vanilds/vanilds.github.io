spring:
  application:
    name: creditdesk-api
  datasource:
    # Same variable names as k8s/base/config.yaml (ConfigMap + Secret)
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:creditdesk}
    username: ${DB_USER:creditdesk}
    password: ${DB_PASSWORD:creditdesk}
    hikari:
      maximum-pool-size: 10
  jpa:
    open-in-view: false            # no lazy loading from controllers; queries stay in the service layer
    hibernate:
      ddl-auto: validate           # Flyway owns the schema; Hibernate only checks it matches
    properties:
      hibernate.jdbc.time_zone: UTC
  flyway:
    locations: classpath:db/migration
  rabbitmq:
    host: ${RABBITMQ_HOST:localhost}
    port: ${RABBITMQ_PORT:5672}
    username: ${RABBITMQ_USER:creditdesk}
    password: ${RABBITMQ_PASSWORD:creditdesk}
    publisher-confirm-type: correlated   # the broker acknowledges every publish (OutboxRelay waits for it)
    publisher-returns: true              # ...and tells us when no queue took the message
    template:
      mandatory: true
    listener:
      simple:
        prefetch: 10
        default-requeue-rejected: false  # a failure goes to the retry queue, never straight back (tight loop)
  mvc:
    problemdetails:
      enabled: true                # RFC 9457 application/problem+json for framework errors too
  jackson:
    default-property-inclusion: non_null
    serialization:
      write-dates-as-timestamps: false

creditdesk:
  zone-id: America/Sao_Paulo       # business dates (filters, "today") are in São Paulo time
  security:
    # Public URL written in the token ("iss"). Must match exactly, or every token is refused.
    issuer: ${OIDC_ISSUER_URI:http://localhost:8180/realms/creditdesk}
    # Where the API fetches Keycloak's public keys — the internal address (see SecurityConfig)
    jwk-set-uri: ${OIDC_JWK_SET_URI:http://localhost:8180/realms/creditdesk/protocol/openid-connect/certs}
    audience: creditdesk-api
  cors:
    # Browser apps allowed to call the API. Local dev servers + the portfolio on GitHub Pages.
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:4200,http://localhost:4201,http://localhost:4202,https://vanilds.github.io}
  messaging:
    outbox-poll: 500ms             # how often the relay looks for unpublished events
    outbox-retention: 7d           # published events are deleted after this (03:15 São Paulo)
    retry-delay: 10s               # how long a failed message waits in <queue>.retry
    max-attempts: 5                # then it goes to <queue>.dlq
  storage:
    bucket: ${S3_BUCKET:creditdesk-documents-vanilds}
    region: ${S3_REGION:us-east-1}
    endpoint: ${S3_ENDPOINT:}              # empty = real Amazon S3
    public-endpoint: ${S3_PUBLIC_ENDPOINT:}
    access-key: ${S3_ACCESS_KEY:}          # empty = instance profile (EC2) / default AWS credentials chain
    secret-key: ${S3_SECRET_KEY:}
    create-bucket: false                   # on AWS the bucket is infrastructure (infra/aws/setup.sh)
    upload-url-ttl: 5m
    download-url-ttl: 1m
  crypto:
    # No defaults on purpose: the API refuses to start without keys (32 random bytes each, base64).
    # Kubernetes: Secret creditdesk-secrets. AWS (Phase 6): SSM Parameter Store.
    encryption-key: ${DOCUMENT_ENCRYPTION_KEY:}
    hash-key: ${DOCUMENT_HASH_KEY:}

management:
  endpoints:
    web:
      exposure:
        include: health, info, prometheus
  endpoint:
    health:
      probes:
        enabled: true              # /actuator/health/liveness and /readiness for Kubernetes
  info:
    env:
      enabled: true
  metrics:
    distribution:
      # Latency as a histogram (buckets), not client-side percentiles: Prometheus can then compute p95 over any
      # window and across pods. SLO buckets keep the series count small (one node, 3-day retention).
      slo:
        http.server.requests: 100ms, 250ms, 500ms, 1s, 2500ms, 5s   # durations are whole numbers: "2.5s" fails to bind

info:
  app:
    name: CreditDesk API
    version: '@project.version@'

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
  default-produces-media-type: application/json
  writer-with-order-by-keys: true   # stable key order, so diffs of api/openapi.yaml stay readable

server:
  shutdown: graceful               # finish in-flight requests when the pod is terminated
  # Behind the Ingress the API sees http://api:8080. Trust X-Forwarded-Proto/Host from private-network proxies
  # (Tomcat RemoteIpValve), so Location headers and problem "instance" URLs carry the browser's https address.
  forward-headers-strategy: native

logging:
  pattern:
    correlation: "[%X{correlationId:-}] "   # every log line carries the request's X-Correlation-Id

---
# Local development (docker compose / Codespaces): synthetic demo data + throwaway keys
spring:
  config:
    activate:
      on-profile: dev
  flyway:
    # The Phase 1 SQL seed was replaced by a Java one (R__Demo_data); old databases still list it as applied
    ignore-migration-patterns: "*:missing"

creditdesk:
  storage:
    # Local S3 (SeaweedFS in compose.yaml). DEV ONLY credentials.
    bucket: ${S3_BUCKET:documents}
    endpoint: ${S3_ENDPOINT:http://localhost:8333}
    access-key: ${S3_ACCESS_KEY:creditdesk}
    secret-key: ${S3_SECRET_KEY:creditdesk-secret}
    create-bucket: true
  crypto:
    # DEV ONLY — public in this repo, protects nothing but synthetic data. Real environments use their own.
    encryption-key: ${DOCUMENT_ENCRYPTION_KEY:X2PCxAZlMkQLxOP/IeMU4pKdgx2zojqUwLbrolwJih0=}
    hash-key: ${DOCUMENT_HASH_KEY:dJYopkozIxMD7904Qx76FUIQm6p4XobO/mzB8914zE0=}
