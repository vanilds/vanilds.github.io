openapi: 3.1.0
info:
  description: |-
    Credit and debt-renegotiation proposals for bank analysts. All data is synthetic.

    **Auth:** Keycloak access token (`Authorization: Bearer …`). Roles: `ANALYST`, `MANAGER` (includes analyst), `AUDITOR` (read-only).

    **Optimistic locking:** reads return `ETag: "<version>"`; every change needs `If-Match: "<version>"` — missing → 428, stale → 412.

    **Tracing:** send `X-Correlation-Id` or get one back in the response.
  title: CreditDesk API
  version: 0.2.0
servers:
- description: Same origin
  url: /
security:
- keycloak: []
tags:
- description: "Files attached to a proposal, stored in S3 through presigned URLs"
  name: Documents
- description: New credit and renegotiation proposals and their approval workflow
  name: Proposals
- description: Individuals (PF) and companies (PJ)
  name: Customers
- description: Append-only audit trail (MANAGER and AUDITOR)
  name: Audit
- description: Credit opinions drafted by the AI worker after each submission
  name: AI opinions
paths:
  /api/audit:
    get:
      description: Newest first. The period is at most 90 days and defaults to the
        last 30 days.
      operationId: searchAudit
      parameters:
      - description: CUSTOMER or PROPOSAL
        in: query
        name: entityType
        required: false
        schema:
          type: string
      - in: query
        name: entityId
        required: false
        schema:
          type: string
          format: uuid
      - description: Keycloak user id
        in: query
        name: actorId
        required: false
        schema:
          type: string
      - in: query
        name: action
        required: false
        schema:
          type: string
          enum:
          - CUSTOMER_CREATED
          - CUSTOMER_UPDATED
          - CUSTOMER_DELETED
          - CUSTOMER_DOCUMENT_REVEALED
          - PROPOSAL_CREATED
          - PROPOSAL_UPDATED
          - PROPOSAL_SUBMITTED
          - PROPOSAL_CANCELLED
          - PROPOSAL_ANALYSIS_STARTED
          - PROPOSAL_APPROVED
          - PROPOSAL_REJECTED
          - PROPOSAL_RETURNED
          - PROPOSAL_OPINION_RECORDED
          - PROPOSAL_DOCUMENT_ADDED
          - PROPOSAL_DOCUMENT_DOWNLOADED
          - SYSTEM_MIGRATION
      - in: query
        name: from
        required: false
        schema:
          type: string
          format: date
      - in: query
        name: to
        required: false
        schema:
          type: string
          format: date
      - in: query
        name: page
        required: false
        schema:
          type: integer
          format: int32
          default: 0
      - description: "20, 50 or 100"
        in: query
        name: size
        required: false
        schema:
          type: integer
          format: int32
          default: 20
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PageResponseAuditEntryResponse"
          description: OK
      summary: Search the audit trail
      tags:
      - Audit
  /api/customers:
    get:
      description: "Paginated, ordered by name. CPFs are returned masked."
      operationId: searchCustomers
      parameters:
      - description: "Exact CPF/CNPJ, with or without punctuation"
        in: query
        name: document
        required: false
        schema:
          type: string
      - description: "Part of the name, case-insensitive"
        in: query
        name: name
        required: false
        schema:
          type: string
      - in: query
        name: page
        required: false
        schema:
          type: integer
          format: int32
          default: 0
      - description: "20, 50 or 100"
        in: query
        name: size
        required: false
        schema:
          type: integer
          format: int32
          default: 20
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PageResponseCustomerResponse"
          description: OK
      summary: Search customers
      tags:
      - Customers
    post:
      description: Validates CPF/CNPJ check digits and rejects duplicates. The document
        is stored encrypted.
      operationId: createCustomer
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateCustomerRequest"
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CustomerResponse"
          description: OK
      summary: Register a customer
      tags:
      - Customers
  /api/customers/{id}:
    delete:
      description: Soft delete. Blocked while the customer has open proposals.
      operationId: deleteCustomer
      parameters:
      - in: path
        name: id
        required: true
        schema:
          type: string
          format: uuid
      - description: "ETag from the last read, e.g. \"3\". Required: missing → 428,\
          \ stale → 412."
        in: header
        name: If-Match
        required: false
        schema:
          type: string
      responses:
        "204":
          description: No Content
      summary: Delete a customer
      tags:
      - Customers
    get:
      description: Returns the version as ETag.
      operationId: getCustomer
      parameters:
      - in: path
        name: id
        required: true
        schema:
          type: string
          format: uuid
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CustomerResponse"
          description: OK
      summary: Get a customer
      tags:
      - Customers
    put:
      operationId: updateCustomer
      parameters:
      - in: path
        name: id
        required: true
        schema:
          type: string
          format: uuid
      - description: "ETag from the last read, e.g. \"3\". Required: missing → 428,\
          \ stale → 412."
        in: header
        name: If-Match
        required: false
        schema:
          type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateCustomerRequest"
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CustomerResponse"
          description: OK
      summary: "Update name, e-mail and monthly revenue"
      tags:
      - Customers
  /api/customers/{id}/document/reveal:
    post:
      description: AUDITOR only. The reason is mandatory and recorded in the audit
        trail.
      operationId: revealCustomerDocument
      parameters:
      - in: path
        name: id
        required: true
        schema:
          type: string
          format: uuid
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RevealDocumentRequest"
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RevealedDocumentResponse"
          description: OK
      summary: Reveal the full CPF/CNPJ
      tags:
      - Customers
  /api/proposals:
    get:
      description: Newest first. The period is at most 90 days and defaults to the
        last 30 days.
      operationId: searchProposals
      parameters:
      - in: query
        name: status
        required: false
        schema:
          type: string
          enum:
          - DRAFT
          - SUBMITTED
          - IN_ANALYSIS
          - APPROVED
          - REJECTED
          - CANCELLED
      - description: "First day, inclusive (São Paulo date), e.g. 2026-11-01"
        in: query
        name: from
        required: false
        schema:
          type: string
          format: date
      - description: "Last day, inclusive (São Paulo date). Defaults to today."
        in: query
        name: to
        required: false
        schema:
          type: string
          format: date
      - in: query
        name: customerId
        required: false
        schema:
          type: string
          format: uuid
      - description: Only proposals owned by this analyst (Keycloak id). Use mine=true
          for your own.
        in: query
        name: analystId
        required: false
        schema:
          type: string
      - description: true = only my proposals
        in: query
        name: mine
        required: false
        schema:
          type: boolean
          default: false
      - in: query
        name: page
        required: false
        schema:
          type: integer
          format: int32
          default: 0
      - description: "20, 50 or 100"
        in: query
        name: size
        required: false
        schema:
          type: integer
          format: int32
          default: 20
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PageResponseProposalResponse"
          description: OK
      summary: Search proposals
      tags:
      - Proposals
    post:
      description: "Always created as DRAFT, owned by the caller."
      operationId: createProposal
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateProposalRequest"
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProposalResponse"
          description: OK
      summary: Create a proposal
      tags:
      - Proposals
  /api/proposals/{id}:
    get:
      description: Returns the version as ETag.
      operationId: getProposal
      parameters:
      - in: path
        name: id
        required: true
        schema:
          type: string
          format: uuid
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProposalResponse"
          description: OK
      summary: Get a proposal
      tags:
      - Proposals
    put:
      description: "Owner only, while DRAFT."
      operationId: updateProposal
      parameters:
      - in: path
        name: id
        required: true
        schema:
          type: string
          format: uuid
      - description: "ETag from the last read, e.g. \"3\". Required: missing → 428,\
          \ stale → 412."
        in: header
        name: If-Match
        required: false
        schema:
          type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateProposalRequest"
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProposalResponse"
          description: OK
      summary: Edit a proposal
      tags:
      - Proposals
  /api/proposals/{id}/approve:
    post:
      description: "Manager, not the author (four-eyes). IN_ANALYSIS → APPROVED."
      operationId: approveProposal
      parameters:
      - in: path
        name: id
        required: true
        schema:
          type: string
          format: uuid
      - description: "ETag from the last read, e.g. \"3\". Required: missing → 428,\
          \ stale → 412."
        in: header
        name: If-Match
        required: false
        schema:
          type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TransitionRequest"
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProposalResponse"
          description: OK
      summary: Approve
      tags:
      - Proposals
  /api/proposals/{id}/cancel:
    post:
      description: Owner only. DRAFT → CANCELLED.
      operationId: cancelProposal
      parameters:
      - in: path
        name: id
        required: true
        schema:
          type: string
          format: uuid
      - description: "ETag from the last read, e.g. \"3\". Required: missing → 428,\
          \ stale → 412."
        in: header
        name: If-Match
        required: false
        schema:
          type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TransitionRequest"
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProposalResponse"
          description: OK
      summary: Cancel a draft
      tags:
      - Proposals
  /api/proposals/{id}/documents:
    get:
      description: "Only confirmed (AVAILABLE) documents, oldest first."
      operationId: listProposalDocuments
      parameters:
      - in: path
        name: id
        required: true
        schema:
          type: string
          format: uuid
      responses:
        "200":
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/DocumentResponse"
          description: OK
      summary: Documents of a proposal
      tags:
      - Documents
    post:
      description: "Owner only, while DRAFT. PDF, JPEG or PNG up to 10 MB, at most\
        \ 10 per proposal. Returns a presigned PUT URL valid for 5 minutes: send the\
        \ file there, then call confirm."
      operationId: addProposalDocument
      parameters:
      - in: path
        name: id
        required: true
        schema:
          type: string
          format: uuid
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AddDocumentRequest"
        required: true
      responses:
        "201":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UploadResponse"
          description: Created
      summary: Start an upload
      tags:
      - Documents
  /api/proposals/{id}/documents/{documentId}/confirm:
    post:
      description: "The API checks the object in S3 (exists, same size and type) and\
        \ makes it AVAILABLE. 409 if the file was not sent yet; 422 if it differs\
        \ from what was declared."
      operationId: confirmProposalDocument
      parameters:
      - in: path
        name: id
        required: true
        schema:
          type: string
          format: uuid
      - in: path
        name: documentId
        required: true
        schema:
          type: string
          format: uuid
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DocumentResponse"
          description: OK
      summary: Finish an upload
      tags:
      - Documents
  /api/proposals/{id}/documents/{documentId}/download:
    post:
      description: "A presigned GET URL valid for about a minute. POST, not GET: every\
        \ download is audited, so asking for a link is an action, not a harmless read."
      operationId: downloadProposalDocument
      parameters:
      - in: path
        name: id
        required: true
        schema:
          type: string
          format: uuid
      - in: path
        name: documentId
        required: true
        schema:
          type: string
          format: uuid
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DownloadResponse"
          description: OK
      summary: Get a download link
      tags:
      - Documents
  /api/proposals/{id}/history:
    get:
      description: "Every status change, oldest first, with who did it and the reason."
      operationId: getProposalHistory
      parameters:
      - in: path
        name: id
        required: true
        schema:
          type: string
          format: uuid
      responses:
        "200":
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/StatusChangeResponse"
          description: OK
      summary: Status timeline
      tags:
      - Proposals
  /api/proposals/{id}/opinions:
    get:
      description: "Newest first; empty while the worker is still drafting. The screen\
        \ polls this after a submit. Advisory only: approving or rejecting is always\
        \ a manager's decision."
      operationId: listProposalOpinions
      parameters:
      - in: path
        name: id
        required: true
        schema:
          type: string
          format: uuid
      responses:
        "200":
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/OpinionResponse"
          description: OK
      summary: AI opinions of a proposal
      tags:
      - AI opinions
  /api/proposals/{id}/reject:
    post:
      description: "Manager, not the author. Reason required. IN_ANALYSIS → REJECTED."
      operationId: rejectProposal
      parameters:
      - in: path
        name: id
        required: true
        schema:
          type: string
          format: uuid
      - description: "ETag from the last read, e.g. \"3\". Required: missing → 428,\
          \ stale → 412."
        in: header
        name: If-Match
        required: false
        schema:
          type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TransitionRequest"
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProposalResponse"
          description: OK
      summary: Reject
      tags:
      - Proposals
  /api/proposals/{id}/return:
    post:
      description: "Manager, not the author. Reason required. IN_ANALYSIS → DRAFT\
        \ (editable again)."
      operationId: returnProposal
      parameters:
      - in: path
        name: id
        required: true
        schema:
          type: string
          format: uuid
      - description: "ETag from the last read, e.g. \"3\". Required: missing → 428,\
          \ stale → 412."
        in: header
        name: If-Match
        required: false
        schema:
          type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TransitionRequest"
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProposalResponse"
          description: OK
      summary: Return to the analyst for changes
      tags:
      - Proposals
  /api/proposals/{id}/start-analysis:
    post:
      description: "Manager, not the author. SUBMITTED → IN_ANALYSIS. From Phase 4\
        \ the AI worker does this automatically; this stays as the manual path when\
        \ the worker is down."
      operationId: startProposalAnalysis
      parameters:
      - in: path
        name: id
        required: true
        schema:
          type: string
          format: uuid
      - description: "ETag from the last read, e.g. \"3\". Required: missing → 428,\
          \ stale → 412."
        in: header
        name: If-Match
        required: false
        schema:
          type: string
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProposalResponse"
          description: OK
      summary: Pick up a submitted proposal
      tags:
      - Proposals
  /api/proposals/{id}/submit:
    post:
      description: Owner only. DRAFT → SUBMITTED.
      operationId: submitProposal
      parameters:
      - in: path
        name: id
        required: true
        schema:
          type: string
          format: uuid
      - description: "ETag from the last read, e.g. \"3\". Required: missing → 428,\
          \ stale → 412."
        in: header
        name: If-Match
        required: false
        schema:
          type: string
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProposalResponse"
          description: OK
      summary: Submit for analysis
      tags:
      - Proposals
components:
  schemas:
    AddDocumentRequest:
      type: object
      properties:
        category:
          type: string
          enum:
          - INCOME_PROOF
          - FINANCIAL_STATEMENT
          - BANK_STATEMENT
          - IDENTITY
          - ADDRESS_PROOF
          - DEBT_STATEMENT
          - OTHER
        contentType:
          type: string
          description: "application/pdf, image/jpeg or image/png"
          example: application/pdf
          minLength: 1
        fileName:
          type: string
          example: payslip-october.pdf
          maxLength: 200
          minLength: 0
        sizeBytes:
          type: integer
          format: int64
          description: "Exact size in bytes, at most 10 MB. S3 refuses any other size."
          example: 184320
      required:
      - category
      - contentType
      - fileName
    AuditEntryResponse:
      type: object
      properties:
        action:
          type: string
          enum:
          - CUSTOMER_CREATED
          - CUSTOMER_UPDATED
          - CUSTOMER_DELETED
          - CUSTOMER_DOCUMENT_REVEALED
          - PROPOSAL_CREATED
          - PROPOSAL_UPDATED
          - PROPOSAL_SUBMITTED
          - PROPOSAL_CANCELLED
          - PROPOSAL_ANALYSIS_STARTED
          - PROPOSAL_APPROVED
          - PROPOSAL_REJECTED
          - PROPOSAL_RETURNED
          - PROPOSAL_OPINION_RECORDED
          - PROPOSAL_DOCUMENT_ADDED
          - PROPOSAL_DOCUMENT_DOWNLOADED
          - SYSTEM_MIGRATION
        actorId:
          type: string
          description: Keycloak user id (token subject)
        actorName:
          type: string
          description: Username at the time of the action
          example: marcos
        changes:
          type: object
          additionalProperties: {}
          description: "Changed fields as {\"field\": {\"from\": …, \"to\": …}}; personal\
            \ data masked"
        correlationId:
          type: string
        entityId:
          type: string
          format: uuid
        entityType:
          type: string
          example: PROPOSAL
        id:
          type: string
          format: uuid
        occurredAt:
          type: string
          format: date-time
        reason:
          type: string
    CreateCustomerRequest:
      type: object
      properties:
        document:
          type: string
          description: "CPF (PF) or CNPJ (PJ), with or without punctuation. Alphanumeric\
            \ CNPJ is accepted."
          example: 529.982.247-25
          maxLength: 20
          minLength: 0
        email:
          type: string
          format: email
          example: maria.silva@example.com
          maxLength: 254
          minLength: 0
        monthlyRevenue:
          type: number
          description: Monthly income (PF) or revenue (PJ) in BRL
          example: 8500.0
          maximum: 9999999999999.99
          minimum: 0.00
        name:
          type: string
          example: Maria da Silva
          maxLength: 150
          minLength: 3
        type:
          type: string
          enum:
          - PF
          - PJ
      required:
      - document
      - email
      - monthlyRevenue
      - name
      - type
    CreateProposalRequest:
      type: object
      properties:
        amount:
          type: number
          description: "Principal in BRL, 100.00 to 1,000,000.00"
          example: 15000.0
        customerId:
          type: string
          format: uuid
        installments:
          type: integer
          format: int32
          description: "Monthly installments, 1 to 120"
          example: 24
        kind:
          type: string
          enum:
          - NEW_CREDIT
          - RENEGOTIATION
        monthlyRate:
          type: number
          description: "Monthly rate as a fraction: 0.0199 = 1.99% a month (max 0.2)"
          example: 0.0199
      required:
      - customerId
      - kind
    CustomerResponse:
      type: object
      properties:
        createdAt:
          type: string
          format: date-time
        document:
          type: string
          description: CPF masked (LGPD) or CNPJ formatted
          example: '***.982.247-**'
        email:
          type: string
        id:
          type: string
          format: uuid
        monthlyRevenue:
          type: number
        name:
          type: string
        type:
          type: string
          enum:
          - PF
          - PJ
        updatedAt:
          type: string
          format: date-time
        version:
          type: integer
          format: int64
    DocumentResponse:
      type: object
      properties:
        category:
          type: string
          enum:
          - INCOME_PROOF
          - FINANCIAL_STATEMENT
          - BANK_STATEMENT
          - IDENTITY
          - ADDRESS_PROOF
          - DEBT_STATEMENT
          - OTHER
        confirmedAt:
          type: string
          format: date-time
        contentType:
          type: string
        createdAt:
          type: string
          format: date-time
        fileName:
          type: string
        id:
          type: string
          format: uuid
        sizeBytes:
          type: integer
          format: int64
        status:
          type: string
          enum:
          - PENDING_UPLOAD
          - AVAILABLE
        uploadedByName:
          type: string
    DownloadResponse:
      type: object
      description: Open the URL to download; it expires in about a minute and works
        for this one file only.
      properties:
        expiresAt:
          type: string
          format: date-time
        url:
          type: string
    OpinionResponse:
      type: object
      description: "AI credit opinion. Advisory: it supports the manager's decision,\
        \ it never makes it."
      properties:
        current:
          type: boolean
          description: true for the opinion on the latest submission; false once the
            proposal was returned or submitted again after it
        generatedAt:
          type: string
          format: date-time
        id:
          type: string
          format: uuid
        indicators:
          type: object
          additionalProperties: {}
          description: "Figures the rules used, e.g. installmentToIncome = 0.31"
        model:
          type: string
          description: "Model that wrote the summary, or rules-template when no LLM\
            \ is configured"
          example: rules-template-v1
        proposalVersion:
          type: integer
          format: int64
          description: The submitted version it was drafted for
        receivedAt:
          type: string
          format: date-time
        recommendation:
          type: string
          enum:
          - FAVORABLE
          - CAUTION
          - UNFAVORABLE
        riskFlags:
          type: array
          items:
            $ref: "#/components/schemas/RiskFlag"
        riskLevel:
          type: string
          enum:
          - LOW
          - MEDIUM
          - HIGH
        suggestedPlan:
          $ref: "#/components/schemas/SuggestedPlan"
        summary:
          $ref: "#/components/schemas/Summary"
    PageResponseAuditEntryResponse:
      type: object
      properties:
        content:
          type: array
          items:
            $ref: "#/components/schemas/AuditEntryResponse"
        page:
          type: integer
          format: int32
        size:
          type: integer
          format: int32
        totalElements:
          type: integer
          format: int64
        totalPages:
          type: integer
          format: int32
    PageResponseCustomerResponse:
      type: object
      properties:
        content:
          type: array
          items:
            $ref: "#/components/schemas/CustomerResponse"
        page:
          type: integer
          format: int32
        size:
          type: integer
          format: int32
        totalElements:
          type: integer
          format: int64
        totalPages:
          type: integer
          format: int32
    PageResponseProposalResponse:
      type: object
      properties:
        content:
          type: array
          items:
            $ref: "#/components/schemas/ProposalResponse"
        page:
          type: integer
          format: int32
        size:
          type: integer
          format: int32
        totalElements:
          type: integer
          format: int64
        totalPages:
          type: integer
          format: int32
    ProposalResponse:
      type: object
      properties:
        amount:
          type: number
        analystId:
          type: string
          description: Keycloak id of the analyst who owns the proposal
        analystName:
          type: string
          example: ana
        createdAt:
          type: string
          format: date-time
        customerId:
          type: string
          format: uuid
        customerName:
          type: string
        id:
          type: string
          format: uuid
        installmentAmount:
          type: number
          description: Fixed monthly installment (Tabela Price)
          example: 792.17
        installments:
          type: integer
          format: int32
        kind:
          type: string
          enum:
          - NEW_CREDIT
          - RENEGOTIATION
        monthlyRate:
          type: number
        status:
          type: string
          enum:
          - DRAFT
          - SUBMITTED
          - IN_ANALYSIS
          - APPROVED
          - REJECTED
          - CANCELLED
        totalAmount:
          type: number
          description: installmentAmount × installments
          example: 19012.08
        updatedAt:
          type: string
          format: date-time
        version:
          type: integer
          format: int64
    RevealDocumentRequest:
      type: object
      properties:
        reason:
          type: string
          description: Why the full document is needed
          example: "Ticket SAC-4821: confirm customer identity"
          maxLength: 500
          minLength: 10
      required:
      - reason
    RevealedDocumentResponse:
      type: object
      properties:
        customerId:
          type: string
          format: uuid
        document:
          type: string
          description: "Full CPF/CNPJ, formatted"
          example: 529.982.247-25
        type:
          type: string
          enum:
          - PF
          - PJ
    RiskFlag:
      type: object
      properties:
        code:
          type: string
          example: HIGH_INSTALLMENT_TO_INCOME
          maxLength: 60
          minLength: 0
        message:
          type: string
          description: English explanation; the front translates by code
          maxLength: 500
          minLength: 0
        severity:
          type: string
          enum:
          - LOW
          - MEDIUM
          - HIGH
      required:
      - code
      - message
      - severity
    SignedRequest:
      type: object
      properties:
        expiresAt:
          type: string
          format: date-time
        headers:
          type: object
          additionalProperties:
            type: string
        method:
          type: string
        url:
          type: string
    StatusChangeResponse:
      type: object
      properties:
        actorName:
          type: string
        changedAt:
          type: string
          format: date-time
        from:
          type: string
          description: Null for the creation of the proposal
          enum:
          - DRAFT
          - SUBMITTED
          - IN_ANALYSIS
          - APPROVED
          - REJECTED
          - CANCELLED
        id:
          type: string
          format: uuid
        reason:
          type: string
        to:
          type: string
          enum:
          - DRAFT
          - SUBMITTED
          - IN_ANALYSIS
          - APPROVED
          - REJECTED
          - CANCELLED
    SuggestedPlan:
      type: object
      properties:
        installmentAmount:
          type: number
          minimum: 0.01
        installmentToIncome:
          type: number
        installments:
          type: integer
          format: int32
      required:
      - installmentAmount
      - installmentToIncome
    Summary:
      type: object
      properties:
        en:
          type: string
          maxLength: 4000
          minLength: 0
        pt:
          type: string
          maxLength: 4000
          minLength: 0
      required:
      - en
      - pt
    TransitionRequest:
      type: object
      properties:
        reason:
          type: string
          description: Mandatory for reject and return; shown to the analyst
          example: Missing proof of income
          maxLength: 500
          minLength: 0
    UpdateCustomerRequest:
      type: object
      properties:
        email:
          type: string
          format: email
          example: maria.souza@example.com
          maxLength: 254
          minLength: 0
        monthlyRevenue:
          type: number
          example: 9200.0
          maximum: 9999999999999.99
          minimum: 0.00
        name:
          type: string
          example: Maria da Silva Souza
          maxLength: 150
          minLength: 3
      required:
      - email
      - monthlyRevenue
      - name
    UpdateProposalRequest:
      type: object
      properties:
        amount:
          type: number
          description: "Principal in BRL, 100.00 to 1,000,000.00"
          example: 18000.0
        installments:
          type: integer
          format: int32
          description: "Monthly installments, 1 to 120"
          example: 36
        kind:
          type: string
          enum:
          - NEW_CREDIT
          - RENEGOTIATION
        monthlyRate:
          type: number
          description: "Monthly rate as a fraction: 0.0199 = 1.99% a month (max 0.2)"
          example: 0.0189
      required:
      - kind
    UploadResponse:
      type: object
      description: "Send the file with exactly this method, URL and headers, then\
        \ call confirm."
      properties:
        document:
          $ref: "#/components/schemas/DocumentResponse"
        upload:
          $ref: "#/components/schemas/SignedRequest"
  securitySchemes:
    keycloak:
      bearerFormat: JWT
      description: Access token from Keycloak (realm creditdesk). See api/requests.http
        for how to get one.
      scheme: bearer
      type: http
