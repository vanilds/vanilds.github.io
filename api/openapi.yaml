openapi: 3.1.0
info:
  description: |-
    Credit and debt-renegotiation proposals for bank analysts. All data is synthetic.

    **Auth:** Keycloak access token (`Authorization: Bearer …`). Roles: `ANALYST`, `MANAGER` (includes analyst), `AUDITOR` (read-only).

    **Optimistic locking:** reads return `ETag: "<version>"`; every change needs `If-Match: "<version>"` — missing → 428, stale → 412.

    **Tracing:** send `X-Correlation-Id` or get one back in the response.
  title: CreditDesk API
  version: 0.2.0
servers:
- description: Same origin
  url: /
security:
- keycloak: []
tags:
- description: New credit and renegotiation proposals and their approval workflow
  name: Proposals
- description: Individuals (PF) and companies (PJ)
  name: Customers
- description: Append-only audit trail (MANAGER and AUDITOR)
  name: Audit
paths:
  /api/audit:
    get:
      description: Newest first. The period is at most 90 days and defaults to the
        last 30 days.
      operationId: searchAudit
      parameters:
      - description: CUSTOMER or PROPOSAL
        in: query
        name: entityType
        required: false
        schema:
          type: string
      - in: query
        name: entityId
        required: false
        schema:
          type: string
          format: uuid
      - description: Keycloak user id
        in: query
        name: actorId
        required: false
        schema:
          type: string
      - in: query
        name: action
        required: false
        schema:
          type: string
          enum:
          - CUSTOMER_CREATED
          - CUSTOMER_UPDATED
          - CUSTOMER_DELETED
          - CUSTOMER_DOCUMENT_REVEALED
          - PROPOSAL_CREATED
          - PROPOSAL_UPDATED
          - PROPOSAL_SUBMITTED
          - PROPOSAL_CANCELLED
          - PROPOSAL_ANALYSIS_STARTED
          - PROPOSAL_APPROVED
          - PROPOSAL_REJECTED
          - PROPOSAL_RETURNED
          - SYSTEM_MIGRATION
      - in: query
        name: from
        required: false
        schema:
          type: string
          format: date
      - in: query
        name: to
        required: false
        schema:
          type: string
          format: date
      - in: query
        name: page
        required: false
        schema:
          type: integer
          format: int32
          default: 0
      - description: "20, 50 or 100"
        in: query
        name: size
        required: false
        schema:
          type: integer
          format: int32
          default: 20
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PageResponseAuditEntryResponse"
          description: OK
      summary: Search the audit trail
      tags:
      - Audit
  /api/customers:
    get:
      description: "Paginated, ordered by name. CPFs are returned masked."
      operationId: searchCustomers
      parameters:
      - description: "Exact CPF/CNPJ, with or without punctuation"
        in: query
        name: document
        required: false
        schema:
          type: string
      - description: "Part of the name, case-insensitive"
        in: query
        name: name
        required: false
        schema:
          type: string
      - in: query
        name: page
        required: false
        schema:
          type: integer
          format: int32
          default: 0
      - description: "20, 50 or 100"
        in: query
        name: size
        required: false
        schema:
          type: integer
          format: int32
          default: 20
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PageResponseCustomerResponse"
          description: OK
      summary: Search customers
      tags:
      - Customers
    post:
      description: Validates CPF/CNPJ check digits and rejects duplicates. The document
        is stored encrypted.
      operationId: createCustomer
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateCustomerRequest"
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CustomerResponse"
          description: OK
      summary: Register a customer
      tags:
      - Customers
  /api/customers/{id}:
    delete:
      description: Soft delete. Blocked while the customer has open proposals.
      operationId: deleteCustomer
      parameters:
      - in: path
        name: id
        required: true
        schema:
          type: string
          format: uuid
      - description: "ETag from the last read, e.g. \"3\". Required: missing → 428,\
          \ stale → 412."
        in: header
        name: If-Match
        required: false
        schema:
          type: string
      responses:
        "204":
          description: No Content
      summary: Delete a customer
      tags:
      - Customers
    get:
      description: Returns the version as ETag.
      operationId: getCustomer
      parameters:
      - in: path
        name: id
        required: true
        schema:
          type: string
          format: uuid
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CustomerResponse"
          description: OK
      summary: Get a customer
      tags:
      - Customers
    put:
      operationId: updateCustomer
      parameters:
      - in: path
        name: id
        required: true
        schema:
          type: string
          format: uuid
      - description: "ETag from the last read, e.g. \"3\". Required: missing → 428,\
          \ stale → 412."
        in: header
        name: If-Match
        required: false
        schema:
          type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateCustomerRequest"
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CustomerResponse"
          description: OK
      summary: "Update name, e-mail and monthly revenue"
      tags:
      - Customers
  /api/customers/{id}/document/reveal:
    post:
      description: AUDITOR only. The reason is mandatory and recorded in the audit
        trail.
      operationId: revealCustomerDocument
      parameters:
      - in: path
        name: id
        required: true
        schema:
          type: string
          format: uuid
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RevealDocumentRequest"
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RevealedDocumentResponse"
          description: OK
      summary: Reveal the full CPF/CNPJ
      tags:
      - Customers
  /api/proposals:
    get:
      description: Newest first. The period is at most 90 days and defaults to the
        last 30 days.
      operationId: searchProposals
      parameters:
      - in: query
        name: status
        required: false
        schema:
          type: string
          enum:
          - DRAFT
          - SUBMITTED
          - IN_ANALYSIS
          - APPROVED
          - REJECTED
          - CANCELLED
      - description: "First day, inclusive (São Paulo date), e.g. 2026-11-01"
        in: query
        name: from
        required: false
        schema:
          type: string
          format: date
      - description: "Last day, inclusive (São Paulo date). Defaults to today."
        in: query
        name: to
        required: false
        schema:
          type: string
          format: date
      - in: query
        name: customerId
        required: false
        schema:
          type: string
          format: uuid
      - description: Only proposals owned by this analyst (Keycloak id). Use mine=true
          for your own.
        in: query
        name: analystId
        required: false
        schema:
          type: string
      - description: true = only my proposals
        in: query
        name: mine
        required: false
        schema:
          type: boolean
          default: false
      - in: query
        name: page
        required: false
        schema:
          type: integer
          format: int32
          default: 0
      - description: "20, 50 or 100"
        in: query
        name: size
        required: false
        schema:
          type: integer
          format: int32
          default: 20
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PageResponseProposalResponse"
          description: OK
      summary: Search proposals
      tags:
      - Proposals
    post:
      description: "Always created as DRAFT, owned by the caller."
      operationId: createProposal
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateProposalRequest"
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProposalResponse"
          description: OK
      summary: Create a proposal
      tags:
      - Proposals
  /api/proposals/{id}:
    get:
      description: Returns the version as ETag.
      operationId: getProposal
      parameters:
      - in: path
        name: id
        required: true
        schema:
          type: string
          format: uuid
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProposalResponse"
          description: OK
      summary: Get a proposal
      tags:
      - Proposals
    put:
      description: "Owner only, while DRAFT."
      operationId: updateProposal
      parameters:
      - in: path
        name: id
        required: true
        schema:
          type: string
          format: uuid
      - description: "ETag from the last read, e.g. \"3\". Required: missing → 428,\
          \ stale → 412."
        in: header
        name: If-Match
        required: false
        schema:
          type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateProposalRequest"
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProposalResponse"
          description: OK
      summary: Edit a proposal
      tags:
      - Proposals
  /api/proposals/{id}/approve:
    post:
      description: "Manager, not the author (four-eyes). IN_ANALYSIS → APPROVED."
      operationId: approveProposal
      parameters:
      - in: path
        name: id
        required: true
        schema:
          type: string
          format: uuid
      - description: "ETag from the last read, e.g. \"3\". Required: missing → 428,\
          \ stale → 412."
        in: header
        name: If-Match
        required: false
        schema:
          type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TransitionRequest"
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProposalResponse"
          description: OK
      summary: Approve
      tags:
      - Proposals
  /api/proposals/{id}/cancel:
    post:
      description: Owner only. DRAFT → CANCELLED.
      operationId: cancelProposal
      parameters:
      - in: path
        name: id
        required: true
        schema:
          type: string
          format: uuid
      - description: "ETag from the last read, e.g. \"3\". Required: missing → 428,\
          \ stale → 412."
        in: header
        name: If-Match
        required: false
        schema:
          type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TransitionRequest"
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProposalResponse"
          description: OK
      summary: Cancel a draft
      tags:
      - Proposals
  /api/proposals/{id}/history:
    get:
      description: "Every status change, oldest first, with who did it and the reason."
      operationId: getProposalHistory
      parameters:
      - in: path
        name: id
        required: true
        schema:
          type: string
          format: uuid
      responses:
        "200":
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/StatusChangeResponse"
          description: OK
      summary: Status timeline
      tags:
      - Proposals
  /api/proposals/{id}/reject:
    post:
      description: "Manager, not the author. Reason required. IN_ANALYSIS → REJECTED."
      operationId: rejectProposal
      parameters:
      - in: path
        name: id
        required: true
        schema:
          type: string
          format: uuid
      - description: "ETag from the last read, e.g. \"3\". Required: missing → 428,\
          \ stale → 412."
        in: header
        name: If-Match
        required: false
        schema:
          type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TransitionRequest"
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProposalResponse"
          description: OK
      summary: Reject
      tags:
      - Proposals
  /api/proposals/{id}/return:
    post:
      description: "Manager, not the author. Reason required. IN_ANALYSIS → DRAFT\
        \ (editable again)."
      operationId: returnProposal
      parameters:
      - in: path
        name: id
        required: true
        schema:
          type: string
          format: uuid
      - description: "ETag from the last read, e.g. \"3\". Required: missing → 428,\
          \ stale → 412."
        in: header
        name: If-Match
        required: false
        schema:
          type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TransitionRequest"
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProposalResponse"
          description: OK
      summary: Return to the analyst for changes
      tags:
      - Proposals
  /api/proposals/{id}/start-analysis:
    post:
      description: "Manager, not the author. SUBMITTED → IN_ANALYSIS. From Phase 4\
        \ the AI worker does this automatically; this stays as the manual path when\
        \ the worker is down."
      operationId: startProposalAnalysis
      parameters:
      - in: path
        name: id
        required: true
        schema:
          type: string
          format: uuid
      - description: "ETag from the last read, e.g. \"3\". Required: missing → 428,\
          \ stale → 412."
        in: header
        name: If-Match
        required: false
        schema:
          type: string
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProposalResponse"
          description: OK
      summary: Pick up a submitted proposal
      tags:
      - Proposals
  /api/proposals/{id}/submit:
    post:
      description: Owner only. DRAFT → SUBMITTED.
      operationId: submitProposal
      parameters:
      - in: path
        name: id
        required: true
        schema:
          type: string
          format: uuid
      - description: "ETag from the last read, e.g. \"3\". Required: missing → 428,\
          \ stale → 412."
        in: header
        name: If-Match
        required: false
        schema:
          type: string
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProposalResponse"
          description: OK
      summary: Submit for analysis
      tags:
      - Proposals
components:
  schemas:
    AuditEntryResponse:
      type: object
      properties:
        action:
          type: string
          enum:
          - CUSTOMER_CREATED
          - CUSTOMER_UPDATED
          - CUSTOMER_DELETED
          - CUSTOMER_DOCUMENT_REVEALED
          - PROPOSAL_CREATED
          - PROPOSAL_UPDATED
          - PROPOSAL_SUBMITTED
          - PROPOSAL_CANCELLED
          - PROPOSAL_ANALYSIS_STARTED
          - PROPOSAL_APPROVED
          - PROPOSAL_REJECTED
          - PROPOSAL_RETURNED
          - SYSTEM_MIGRATION
        actorId:
          type: string
          description: Keycloak user id (token subject)
        actorName:
          type: string
          description: Username at the time of the action
          example: marcos
        changes:
          type: object
          additionalProperties: {}
          description: "Changed fields as {\"field\": {\"from\": …, \"to\": …}}; personal\
            \ data masked"
        correlationId:
          type: string
        entityId:
          type: string
          format: uuid
        entityType:
          type: string
          example: PROPOSAL
        id:
          type: string
          format: uuid
        occurredAt:
          type: string
          format: date-time
        reason:
          type: string
    CreateCustomerRequest:
      type: object
      properties:
        document:
          type: string
          description: "CPF (PF) or CNPJ (PJ), with or without punctuation. Alphanumeric\
            \ CNPJ is accepted."
          example: 529.982.247-25
          maxLength: 20
          minLength: 0
        email:
          type: string
          format: email
          example: maria.silva@example.com
          maxLength: 254
          minLength: 0
        monthlyRevenue:
          type: number
          description: Monthly income (PF) or revenue (PJ) in BRL
          example: 8500.0
          maximum: 9999999999999.99
          minimum: 0.00
        name:
          type: string
          example: Maria da Silva
          maxLength: 150
          minLength: 3
        type:
          type: string
          enum:
          - PF
          - PJ
      required:
      - document
      - email
      - monthlyRevenue
      - name
      - type
    CreateProposalRequest:
      type: object
      properties:
        amount:
          type: number
          description: "Principal in BRL, 100.00 to 1,000,000.00"
          example: 15000.0
        customerId:
          type: string
          format: uuid
        installments:
          type: integer
          format: int32
          description: "Monthly installments, 1 to 120"
          example: 24
        kind:
          type: string
          enum:
          - NEW_CREDIT
          - RENEGOTIATION
        monthlyRate:
          type: number
          description: "Monthly rate as a fraction: 0.0199 = 1.99% a month (max 0.2)"
          example: 0.0199
      required:
      - customerId
      - kind
    CustomerResponse:
      type: object
      properties:
        createdAt:
          type: string
          format: date-time
        document:
          type: string
          description: CPF masked (LGPD) or CNPJ formatted
          example: '***.982.247-**'
        email:
          type: string
        id:
          type: string
          format: uuid
        monthlyRevenue:
          type: number
        name:
          type: string
        type:
          type: string
          enum:
          - PF
          - PJ
        updatedAt:
          type: string
          format: date-time
        version:
          type: integer
          format: int64
    PageResponseAuditEntryResponse:
      type: object
      properties:
        content:
          type: array
          items:
            $ref: "#/components/schemas/AuditEntryResponse"
        page:
          type: integer
          format: int32
        size:
          type: integer
          format: int32
        totalElements:
          type: integer
          format: int64
        totalPages:
          type: integer
          format: int32
    PageResponseCustomerResponse:
      type: object
      properties:
        content:
          type: array
          items:
            $ref: "#/components/schemas/CustomerResponse"
        page:
          type: integer
          format: int32
        size:
          type: integer
          format: int32
        totalElements:
          type: integer
          format: int64
        totalPages:
          type: integer
          format: int32
    PageResponseProposalResponse:
      type: object
      properties:
        content:
          type: array
          items:
            $ref: "#/components/schemas/ProposalResponse"
        page:
          type: integer
          format: int32
        size:
          type: integer
          format: int32
        totalElements:
          type: integer
          format: int64
        totalPages:
          type: integer
          format: int32
    ProposalResponse:
      type: object
      properties:
        amount:
          type: number
        analystId:
          type: string
          description: Keycloak id of the analyst who owns the proposal
        analystName:
          type: string
          example: ana
        createdAt:
          type: string
          format: date-time
        customerId:
          type: string
          format: uuid
        customerName:
          type: string
        id:
          type: string
          format: uuid
        installmentAmount:
          type: number
          description: Fixed monthly installment (Tabela Price)
          example: 792.17
        installments:
          type: integer
          format: int32
        kind:
          type: string
          enum:
          - NEW_CREDIT
          - RENEGOTIATION
        monthlyRate:
          type: number
        status:
          type: string
          enum:
          - DRAFT
          - SUBMITTED
          - IN_ANALYSIS
          - APPROVED
          - REJECTED
          - CANCELLED
        totalAmount:
          type: number
          description: installmentAmount × installments
          example: 19012.08
        updatedAt:
          type: string
          format: date-time
        version:
          type: integer
          format: int64
    RevealDocumentRequest:
      type: object
      properties:
        reason:
          type: string
          description: Why the full document is needed
          example: "Ticket SAC-4821: confirm customer identity"
          maxLength: 500
          minLength: 10
      required:
      - reason
    RevealedDocumentResponse:
      type: object
      properties:
        customerId:
          type: string
          format: uuid
        document:
          type: string
          description: "Full CPF/CNPJ, formatted"
          example: 529.982.247-25
        type:
          type: string
          enum:
          - PF
          - PJ
    StatusChangeResponse:
      type: object
      properties:
        actorName:
          type: string
        changedAt:
          type: string
          format: date-time
        from:
          type: string
          description: Null for the creation of the proposal
          enum:
          - DRAFT
          - SUBMITTED
          - IN_ANALYSIS
          - APPROVED
          - REJECTED
          - CANCELLED
        id:
          type: string
          format: uuid
        reason:
          type: string
        to:
          type: string
          enum:
          - DRAFT
          - SUBMITTED
          - IN_ANALYSIS
          - APPROVED
          - REJECTED
          - CANCELLED
    TransitionRequest:
      type: object
      properties:
        reason:
          type: string
          description: Mandatory for reject and return; shown to the analyst
          example: Missing proof of income
          maxLength: 500
          minLength: 0
    UpdateCustomerRequest:
      type: object
      properties:
        email:
          type: string
          format: email
          example: maria.souza@example.com
          maxLength: 254
          minLength: 0
        monthlyRevenue:
          type: number
          example: 9200.0
          maximum: 9999999999999.99
          minimum: 0.00
        name:
          type: string
          example: Maria da Silva Souza
          maxLength: 150
          minLength: 3
      required:
      - email
      - monthlyRevenue
      - name
    UpdateProposalRequest:
      type: object
      properties:
        amount:
          type: number
          description: "Principal in BRL, 100.00 to 1,000,000.00"
          example: 18000.0
        installments:
          type: integer
          format: int32
          description: "Monthly installments, 1 to 120"
          example: 36
        kind:
          type: string
          enum:
          - NEW_CREDIT
          - RENEGOTIATION
        monthlyRate:
          type: number
          description: "Monthly rate as a fraction: 0.0199 = 1.99% a month (max 0.2)"
          example: 0.0189
      required:
      - kind
  securitySchemes:
    keycloak:
      bearerFormat: JWT
      description: Access token from Keycloak (realm creditdesk). See api/requests.http
        for how to get one.
      scheme: bearer
      type: http
